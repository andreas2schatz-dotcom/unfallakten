# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml – ENTWICKLUNG
# Startet: Backend (Flask Dev-Server) + Frontend (Vite Dev-Server)
#
# Starten:  docker compose up
# Neubauen: docker compose up --build
# Stoppen:  docker compose down
#
# HINWEIS: E-Akte-Mount geht nach jedem Docker-/PC-Neustart verloren und muss
# in der DOCKER-DESKTOP-VM erneuert werden (nicht in der Standard-WSL-Distro!).
# Zugangsdaten: EAKTE_SMB_USER / EAKTE_SMB_PASSWORD in .env (Benutzername
# enthält ein Leerzeichen -> einfache Anführungszeichen sind Pflicht).
# Danach: docker restart unfallakten-backend-dev (laufender Container sieht
# den neuen Mount sonst nicht). Verifikation: docker exec unfallakten-backend-dev ls /mnt/eakte
#
#   wsl -d docker-desktop -- sh -c "mount -t cifs //192.168.10.100/ServerSQL/ra /mnt/eakte -o 'username=<EAKTE_SMB_USER>,password=<EAKTE_SMB_PASSWORD>,ro'"
#
# URLs:
#   Frontend: http://localhost:5173
#   Backend:  http://localhost:5000
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend: Flask Dev-Server ───────────────────────────────────────────────
  backend:
    build:
      context: .
      target: builder
    image: unfallakten-backend:dev
    container_name: unfallakten-backend-dev
    command: >
      python -m flask
      --app "backend.app:erstelle_app()"
      run
      --host 0.0.0.0
      --port 5000
      --debug
      --reload
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "true"
      DB_PATH: /app/data/unfallakten.db
      UPLOAD_DIR: /app/uploads
      JWT_SECRET_KEY: dev-secret-key-nicht-fuer-produktion
      FLASK_SECRET_KEY: dev-flask-secret-nicht-fuer-produktion
      CORS_ORIGIN: "http://localhost:5173"
      LOG_LEVEL: DEBUG
      EAKTE_BASE_PATH: /mnt/eakte
      OMA_EXPORT_PFAD: /app/oma_export
      # Dev laeuft als Einzelprozess mit --reload: der Scheduler-Lease (Port-Bind,
      # fuer Gunicorn-Mehrworker gedacht) wird sonst vom Reloader-Elternprozess
      # gehalten, der keine Jobs ausfuehrt -> Intake-Worker tickt nie. Deaktivieren.
      SCHEDULER_LEASE_DISABLED: "1"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend:/app/backend
      - ./tools:/app/tools
      - dev-data:/app/data
      - dev-uploads:/app/uploads
      - /mnt/eakte:/mnt/eakte:ro
      - oma-share:/app/oma_export
      # Infra-Guard-Tests (test_modul6) pruefen diese Repo-Dateien relativ zur
      # Projektwurzel (/app im Container) -- ohne die Mounts koennen die Tests
      # im Container prinzipiell nicht gruen werden (Sanierung 2026-08-11).
      - ./Dockerfile:/app/Dockerfile:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml:ro
      - ./.env.example:/app/.env.example:ro
      - ./.gitignore:/app/.gitignore:ro
      - ./Makefile:/app/Makefile:ro
      - ./nginx/nginx.conf:/app/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/app/nginx/proxy_params.conf:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Frontend: Vite Dev-Server ───────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: unfallakten-frontend-dev
    working_dir: /app
    command: sh -c "npm install --no-audit && npm run dev"
    environment:
      VITE_API_URL: ""
      VITE_BACKEND_URL: "http://backend:5000"
      VITE_DEMO_MODE: "false"
      VITE_APP_TITEL: "Unfallakten [DEV]"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dev-data:
  dev-uploads:
  node_modules:
  # OMA-Export: CIFS-Volume auf den von RA-MICRO ueberwachten Ordner.
  # Docker mountet es bei jedem Start automatisch (ueberlebt Neustart, anders als der manuelle E-Akte-Mount).
  # Zugangsdaten aus .env (EAKTE_SMB_USER/PASSWORD, gleicher ServerSQL-Share). Prod: gleiche Definition in docker-compose.prod.yml nachziehen.
  # Ziel = der von RA-MICRO ueberwachte M-Plattform-Ordner: Windows Z:\RA\M-Plattform,
  # wobei Z: auf \\192.168.10.100\ServerSQL gemappt ist -> Unterpfad ServerSQL/RA/M-Plattform
  # (2026-08-03 korrigiert; vorher faelschlich .../ServerSQL/OMA, dort landete nur eine Test-XML, die RA-MICRO nicht einliest).
  oma-share:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.10.100/ServerSQL/RA/M-Plattform"
      o: "username=${EAKTE_SMB_USER},password=${EAKTE_SMB_PASSWORD},rw,vers=3.1.1,uid=0,gid=0,file_mode=0777,dir_mode=0777,soft,nounix,serverino,mapposix"
