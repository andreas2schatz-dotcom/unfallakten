# ─────────────────────────────────────────────────────────────────────────────
# nginx/nginx.conf – Reverse Proxy für Unfallakten-System
#
# Funktion:
#   - HTTP → HTTPS-Redirect
#   - TLS-Termination (Let's Encrypt oder selbstsigniert)
#   - /auth /akten /email /health  → Gunicorn-Backend  (Port 5000)
#   - /*                           → Frontend-Container (Port 8080, SPA)
#   - Upload-Größe: max. 25 MB
#   - Sicherheits-Header (OWASP / BSI)
#   - Gzip-Komprimierung
#
# Zertifikat mit Let's Encrypt:
#   certbot certonly --standalone -d anwalt-offenbach.de
#   Dann Pfade in ssl_certificate anpassen.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time s';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    # text/html ist bei nginx immer implizit in gzip_types -- nicht explizit
    # aufnehmen, sonst duplicate MIME-Type-Warning beim Start.
    gzip_types
        text/css
        text/javascript
        application/json
        application/javascript
        font/woff2;

    # ── Upload-Größe ──────────────────────────────────────────────────────────
    client_max_body_size 25M;
    client_body_timeout  60s;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;

    # ── Upstream: Gunicorn-Backend ────────────────────────────────────────────
    upstream backend {
        server backend:5000;
        keepalive 32;
    }

    # ── Upstream: Frontend-Container ──────────────────────────────────────────
    upstream frontend {
        server frontend:8080;
        keepalive 16;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # HTTP → HTTPS Redirect
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name anwalt-offenbach.de www.anwalt-offenbach.de;

        # Let's Encrypt ACME-Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # HTTPS: Haupt-Server
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;
        server_name anwalt-offenbach.de www.anwalt-offenbach.de;

        # ── TLS-Zertifikat ────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Moderne TLS-Einstellungen (BSI TR-02102-2)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Sicherheits-Header (OWASP) ────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-Frame-Options           "SAMEORIGIN"     always;
        add_header X-XSS-Protection          "1; mode=block"  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        # CSP: erlaubt Fonts von Google, APIs nur zur selben Domain.
        # add_header erwartet Value als EINEN String -- Multi-Line-Verkettung
        # ist bei dieser Direktive nicht zulaessig (nginx zaehlt zu viele
        # Argumente und schlaegt beim Start mit "invalid number of arguments"
        # fehl). Deshalb: ein durchgehender String.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

        # ── Health-Check: kein Rate-Limiting, kein Logging ────────────────────
        location = /health {
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
            access_log off;
        }

        # ── Login-Endpunkt: strikteres Rate-Limiting ──────────────────────────
        location = /auth/anmelden {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── API-Endpunkte → Backend ───────────────────────────────────────────
        location ~ ^/(auth|akten|email)(/|$) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params.conf;
            # Timeouts für lange Requests (PDF-Parsing, Word-Generierung)
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Statische Assets: lang cachen ─────────────────────────────────────
        location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg)$ {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params.conf;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Frontend SPA (alle anderen Routen) ────────────────────────────────
        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params.conf;
            # index.html: kein Cache
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ── Interne Dateien blockieren ────────────────────────────────────────
        location ~* \.(db|log|env|py|pyc|sh|yml|yaml)$ {
            deny all;
            return 404;
        }
    }
}
