# Rausch-Absender: E-Mails, die beim Eingang automatisch aussortiert werden.
# policy nur_anhaenge -> Body wird gar nicht gespeichert, Anhaenge (z.B. Faxe)
#                       laufen normal in die Queue
# policy komplett     -> Body + alle Anhaenge anlegen und in den Papierkorb
#                       verwerfen (reversibel)
# Telefonanlage. Der Body ist eine Anrufbenachrichtigung und wird nicht
# gespeichert; die Anhaenge sind der Faxeingang und muessen bleiben
# (Entscheidung RA Schatz, 2026-09-09).
- domain: placetel.de
  policy: nur_anhaenge
- domain: bea-brak.de
  policy: komplett
# Fachverlags-Newsletter und Seminarwerbung (Sichtung Posteingang 2026-08-28).
# Bewusst NICHT aufgenommen: anwaltverein.de (Einladungen zu Mitglieder-
# versammlungen der ARGEn) und iww.de (Abo-/Kuendigungskorrespondenz) --
# beide verschicken neben Newslettern auch echte Post.
- domain: eiden-seminare.com
  policy: komplett
- domain: newsletter.anwaltverlag.de
  policy: komplett
- domain: news.deubner-verlag.de
  policy: komplett
- domain: anwaltakademie-event.de
  policy: komplett
- domain: zorn-seminare.de
  policy: komplett
- domain: mails.nomos.de
  policy: komplett
- domain: stempel-fabrik-mail.de
  policy: komplett
- domain: facebookmail.com
  policy: komplett
