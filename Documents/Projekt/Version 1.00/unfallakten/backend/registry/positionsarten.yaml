# positionsarten.yaml — P1.1 (POSITIONSMODELL-PLAN Abschnitt 4.5)
#
# Beschreibt die Positions-Arten je bestehendem POSITION_KEYS-Katalog
# (Quelle: backend/models/abrechnungsschreiben.py POSITION_KEYS).
#
# Konzepte:
#   label:      Anzeige-Text
#   kategorie:  fahrzeugschaden | nebenkosten | personenschaden | sonstiges
#               (steuert die Dashboard-Aggregation, PF-05)
#   checkliste: Liste der Ereignistypen, die fuer "Klage-Bereitschaft" der
#               Position noetig sind (POSITIONSMODELL-PLAN 4.6). Maximal aktuelle
#               Ereignisse dieses Typs auf DER Position (oder als Akten-Scope-
#               Ereignis, z. B. vollmacht_eingegangen) mit dokument_id != NULL.
#   aggregation: dashboard-Gruppierung (fahrzeugschaden, nebenkosten,
#               personenschaden). Muss NICHT identisch mit kategorie sein
#               (Sonder-Gruppierung moeglich).
#
# Der Loader (positionsmodell_registry.py) prueft:
#   * alle POSITION_KEYS aus abrechnungsschreiben.py sind hier abgedeckt.
#   * alle checkliste-Eintraege existieren in ereignistypen.yaml.

positionsarten:

  # ── Fahrzeugschaden (Sach-Positionen)
  reparaturkosten:
    label:       "Reparaturkosten"
    kategorie:   fahrzeugschaden
    aggregation: fahrzeugschaden
    checkliste:  [gutachten_eingegangen, forderung_generiert]
