klasse: rechnung

marker:
  - Rechnung
  - Reparaturrechnung
  - Reparaturkosten
  - Rechnungsnummer
  - Rechnungsbetrag
  - Rechnungsdatum
  - Werkstatt

regex_felder:
  rechnungsnummer:
    - "Rechnungs-?Nr\\.?[:\\s]+([A-Z0-9\\-/]+)"
    - "Rechnungsnummer[:\\s]+([A-Z0-9\\-/]+)"
  rechnungsdatum:
    - "Rechnungsdatum[:\\s]+(\\d{2}\\.\\d{2}\\.\\d{4})"
    - "Datum[:\\s]+(\\d{2}\\.\\d{2}\\.\\d{4})"
  bruttobetrag:
    - "Rechnungsbetrag[:\\s]+([\\d\\.]+,\\d{2})"
    - "Gesamtbetrag[^0-9]{0,10}([\\d\\.]+,\\d{2})"

schema:
  rechnungsnummer: string
  rechnungsdatum: date
  aussteller: string
  nettobetrag: number
  mwst_betrag: number
  bruttobetrag: number

pflichtfelder:
  - rechnungsnummer
  - rechnungsdatum
  - bruttobetrag

kritische_felder:
  - bruttobetrag
  - nettobetrag

validierungsregeln:
  - name: netto_plus_mwst_gleich_brutto
    beschreibung: Netto + 19% MwSt = Brutto (Toleranz 1 Cent)

fristrelevanz: false
loeschfrist_jahre: 10
label: Rechnung
bezeichnung_felder:
  aussteller: aussteller
  datum: rechnungsdatum
  betrag: bruttobetrag
