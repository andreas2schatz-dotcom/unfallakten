klasse: gutachten

marker:
  - Sachverständigengutachten
  - Kfz-Sachverständigenbüro
  - Schadensgutachten
  - Beweissicherungsgutachten
  - Wiederbeschaffungswert
  - Restwert
  - DEKRA Automobil
  - GTÜ
  - TÜV

regex_felder:
  schadendatum:
    - "Schadendatum[:\\s]+(\\d{2}\\.\\d{2}\\.\\d{4})"
    - "Unfalldatum[:\\s]+(\\d{2}\\.\\d{2}\\.\\d{4})"
  auftragsdatum:
    - "Auftragsdatum[:\\s]+(\\d{2}\\.\\d{2}\\.\\d{4})"
  kennzeichen:
    - "Kennzeichen[:\\s]+([A-ZÄÖÜ]{1,3}-[A-Z]{1,2}\\s?\\d{1,4})"
  wiederbeschaffungswert:
    - "Wiederbeschaffungswert[^0-9]{0,40}([\\d\\.]+,\\d{2})"
  # Restwert wird typisch mit "netto" und "brutto" separat ausgewiesen
  # (DEKRA-Gutachten). Beide Werte werden als eigene Felder extrahiert.
  restwert_netto:
    - "Restwert\\s*(?:\\([^\\)]*\\)\\s*)?netto[^0-9]{0,40}([\\d\\.]+,\\d{2})"
    - "Restwert\\s+netto[:\\s]+([\\d\\.]+,\\d{2})"
    - "Netto[^0-9]{0,10}Restwert[^0-9]{0,40}([\\d\\.]+,\\d{2})"
  restwert_brutto:
    - "Restwert\\s*(?:\\([^\\)]*\\)\\s*)?brutto[^0-9]{0,40}([\\d\\.]+,\\d{2})"
    - "Restwert\\s+brutto[:\\s]+([\\d\\.]+,\\d{2})"
    - "Brutto[^0-9]{0,10}Restwert[^0-9]{0,40}([\\d\\.]+,\\d{2})"
  # Legacy-Anker: Restwert ohne netto/brutto-Qualifikation.
  # Bleibt zusaetzlich bestehen, damit Alt-Gutachten ohne Brutto/Netto-
  # Kennzeichnung weiterhin erfasst werden.
  restwert:
    - "Restwert[^0-9a-zA-Z]{1,20}([\\d\\.]+,\\d{2})"
  # DEKRA-Gutachten enthalten haeufig die Sachverstaendigen-Rechnung
  # im selben PDF (Rechnungsblatt am Ende). Wir extrahieren die drei
  # relevanten Felder direkt aus dem Gutachten -- kein PDF-Split noetig.
  sv_rechnungsnummer:
    - "Rechnungs?[\\-\\s]?nummer[:\\s]+([A-Z0-9\\-/]+)"
    - "Rechnung\\s+Nr\\.?[:\\s]+([A-Z0-9\\-/]+)"
  # Umlaut-Toleranz: "Sachverst(aendigen|ändigen|andigen)" -- ae/ä/a
  # abdecken, damit auch OCR-Textvarianten ohne Umlaut greifen.
  # (?i:...)-Gruppen: case-insensitive nur fuer die Wort-Marker
  # (nicht fuer den Betrag). Sachverst(aendigen|ändigen|andigen)
  # -- alle drei Umlaut-Schreibweisen.
  sv_kosten_netto:
    - "(?i:sachverst(?:aendigen|ändigen|andigen)\\-?)?(?i:honorar|verg(?:uetung|ütung|utung)|rechnungsbetrag)[^0-9]{0,40}(?i:netto)[^0-9]{0,20}([\\d\\.]+,\\d{2})"
    - "(?i:nettobetrag)(?:\\s+(?i:rechnung))?[^0-9]{0,20}([\\d\\.]+,\\d{2})"
    - "(?i:rechnungsbetrag\\s+netto)[:\\s]+([\\d\\.]+,\\d{2})"
  sv_kosten_brutto:
    - "(?i:sachverst(?:aendigen|ändigen|andigen)\\-?)?(?i:honorar|verg(?:uetung|ütung|utung)|rechnungsbetrag)[^0-9]{0,40}(?i:brutto)[^0-9]{0,20}([\\d\\.]+,\\d{2})"
    - "(?i:bruttobetrag)(?:\\s+(?i:rechnung))?[^0-9]{0,20}([\\d\\.]+,\\d{2})"
    - "(?i:gesamtbetrag\\s+brutto)[:\\s]+([\\d\\.]+,\\d{2})"
    - "(?i:rechnungsbetrag\\s+brutto)[:\\s]+([\\d\\.]+,\\d{2})"

schema:
  sv_buero: string
  gutachter: string
  auftragsnummer: string
  auftragsdatum: date
  besichtigungsdatum: date
  schadendatum: date
  schadennummer_versicherung: string
  versicherung_name: string
  hersteller: string
  typ: string
  kennzeichen: string
  erstzulassung: date
  vin: string
  schadenart: string
  reparaturkosten_netto: number
  reparaturkosten_brutto: number
  wiederbeschaffungswert: number
  restwert: number
  restwert_netto: number
  restwert_brutto: number
  wertminderung: number
  nutzungsausfall_tagessatz: number
  nutzungsausfall_tage: integer
  sv_rechnungsnummer: string
  sv_kosten_netto: number
  sv_kosten_brutto: number

pflichtfelder:
  - sv_buero
  - kennzeichen
  - schadenart

kritische_felder:
  - wiederbeschaffungswert
  - restwert_netto
  - restwert_brutto
  - reparaturkosten_netto
  - wertminderung

validierungsregeln:
  - name: wbw_positiv
    beschreibung: Wiederbeschaffungswert muss > 0 sein
  - name: restwert_kleiner_wbw
    beschreibung: Restwert ≤ Wiederbeschaffungswert
  - name: restwert_brutto_groesser_netto
    beschreibung: Restwert brutto ≥ Restwert netto

fristrelevanz: false
loeschfrist_jahre: 6
label: Gutachten
bezeichnung_felder:
  aussteller: sv_buero
  datum: besichtigungsdatum
