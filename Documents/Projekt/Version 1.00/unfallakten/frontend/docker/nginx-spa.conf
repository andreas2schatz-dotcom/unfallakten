# ─────────────────────────────────────────────────────────────────────────────
# frontend/docker/nginx-spa.conf
# Eingebettet in den Frontend-Container (nginx:alpine).
# Serviert die React SPA auf Port 8080.
# Alle unbekannten Routen → index.html (React Router).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        font/woff2;

    # ── Cache-Strategie ───────────────────────────────────────────────────────
    # Hash-benannte Chunks: 1 Jahr cachen (Cache-Busting via Hash)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # Bilder: 30 Tage
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires     30d;
        add_header  Cache-Control "public";
        access_log  off;
    }

    # ── index.html: kein Cache (immer aktuell) ────────────────────────────────
    location = /index.html {
        add_header  Cache-Control "no-store, no-cache, must-revalidate";
        add_header  Pragma        "no-cache";
    }

    # ── Healthcheck-Endpunkt ──────────────────────────────────────────────────
    location = /nginx-health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── SPA-Routing: alle anderen Pfade → index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Sicherheit: keine direkten Zugriffe auf interne Dateien ──────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
